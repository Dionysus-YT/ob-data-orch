<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>登录 · OB Data Orch</title>
<style>{{.Styles}}</style>
</head>
<body>
<div class="login">
  <section class="login-brand" aria-labelledby="login-product">
    <img class="login-brand-logo" src="{{.Logo}}" width="275" height="57" alt="青海农信 QHRC">
    <div class="login-brand-body">
      <p class="login-eyebrow">OB Loader / Dumper 4.3.5</p>
      <h1 id="login-product" class="login-product">OB Data Orch</h1>
      <p class="login-positioning">OceanBase 数据导入导出编排平台</p>
      <ul class="login-capabilities" aria-label="平台能力">
        <li><span class="login-capability-name">导出</span><span class="login-capability-tool">OBDUMPER</span></li>
        <li><span class="login-capability-name">普通导入</span><span class="login-capability-tool">OBLOADER</span></li>
        <li><span class="login-capability-name">旁路导入</span><span class="login-capability-tool">DIRECT LOAD</span></li>
      </ul>
    </div>
    <!-- 品牌轨道纹样：取自标识的蓝绿双色圆形，同心环表达数据在节点间的有序流转；纯装饰，不承载信息。 -->
    <svg class="login-motif" viewBox="0 0 640 640" aria-hidden="true" focusable="false">
      <g class="login-motif-rings">
        <path d="M440 640A200 200 0 0 1 640 440"/>
        <path d="M360 640A280 280 0 0 1 640 360"/>
        <path d="M280 640A360 360 0 0 1 640 280"/>
        <path d="M200 640A440 440 0 0 1 640 200"/>
        <path d="M120 640A520 520 0 0 1 640 120"/>
        <path d="M40 640A600 600 0 0 1 640 40"/>
        <path class="login-motif-radial" d="M561.2 539.1L258.3 151.4"/>
      </g>
      <path class="login-motif-blue" d="M640 640L556 543.4A128 128 0 0 1 640 512Z"/>
      <path class="login-motif-green" d="M640 640L512 640A128 128 0 0 1 543.4 556Z"/>
      <g class="login-motif-tracks">
        <path class="login-motif-track-blue" d="M399.1 372.5A360 360 0 0 1 589.9 283.5"/>
        <path class="login-motif-track-green" d="M131.4 531.9A520 520 0 0 1 208.9 349.2"/>
        <path class="login-motif-track-blue" d="M304.5 142.6A600 600 0 0 1 434.8 76.2"/>
      </g>
      <g class="login-motif-nodes">
        <circle class="login-motif-node-blue" cx="589.9" cy="283.5" r="6"/>
        <circle class="login-motif-node-green" cx="208.9" cy="349.2" r="6"/>
        <circle class="login-motif-node-blue" cx="434.8" cy="76.2" r="5"/>
        <circle class="login-motif-node-hollow" cx="528.2" cy="474.2" r="4"/>
        <circle class="login-motif-node-hollow" cx="384.2" cy="526.1" r="4"/>
        <circle class="login-motif-node-hollow" cx="313" cy="345.6" r="4"/>
      </g>
    </svg>
  </section>
  <main class="login-main">
    <div class="login-panel">
      <h2 class="login-title">登录</h2>
      {{if .Message}}<div class="login-alert" role="alert"><svg class="login-icon" viewBox="64 64 896 896" aria-hidden="true" focusable="false"><path d="M512 64c247.4 0 448 200.6 448 448S759.4 960 512 960 64 759.4 64 512 264.6 64 512 64zm127.98 274.82h-.04l-.08.06L512 466.75 384.14 338.88c-.04-.05-.06-.06-.08-.06a.12.12 0 00-.07 0c-.03 0-.05.01-.09.05l-45.02 45.02a.2.2 0 00-.05.09.12.12 0 000 .07v.02a.27.27 0 00.06.06L466.75 512 338.88 639.86c-.05.04-.06.06-.06.08a.12.12 0 000 .07c0 .03.01.05.05.09l45.02 45.02a.2.2 0 00.09.05.12.12 0 00.07 0c.02 0 .04-.01.08-.05L512 557.25l127.86 127.87c.04.04.06.05.08.05a.12.12 0 00.07 0c.03 0 .05-.01.09-.05l45.02-45.02a.2.2 0 00.05-.09.12.12 0 000-.07v-.02a.27.27 0 00-.05-.06L557.25 512l127.87-127.86c.04-.04.05-.06.05-.08a.12.12 0 000-.07c0-.03-.01-.05-.05-.09l-45.02-45.02a.2.2 0 00-.09-.05.12.12 0 00-.07 0z"/></svg><span>{{.Message}}</span></div>{{end}}
      <form class="login-form" method="post" action="/login" data-login-form>
        <div class="login-field">
          <label class="login-label" for="login-username">账户</label>
          <input class="login-input" id="login-username" name="username" value="{{.Username}}" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="64" required>
        </div>
        <div class="login-field">
          <label class="login-label" for="login-password">密码</label>
          <div class="login-password">
            <input class="login-input{{if .Message}} login-input-error{{end}}" id="login-password" type="password" name="password" autocomplete="current-password" maxlength="256" required autofocus{{if .Message}} aria-invalid="true"{{end}} aria-describedby="login-caps">
            <button class="login-reveal" type="button" aria-label="显示密码" aria-pressed="false" aria-controls="login-password" data-login-reveal hidden>
              <svg class="login-icon" data-icon="show" viewBox="64 64 896 896" aria-hidden="true" focusable="false"><path d="M942.2 486.2C847.4 286.5 704.1 186 512 186c-192.2 0-335.4 100.5-430.2 300.3a60.3 60.3 0 000 51.5C176.6 737.5 319.9 838 512 838c192.2 0 335.4-100.5 430.2-300.3 7.7-16.2 7.7-35 0-51.5zM512 766c-161.3 0-279.4-81.8-362.7-254C232.6 339.8 350.7 258 512 258c161.3 0 279.4 81.8 362.7 254C791.5 684.2 673.4 766 512 766zm-4-430c-97.2 0-176 78.8-176 176s78.8 176 176 176 176-78.8 176-176-78.8-176-176-176zm0 288c-61.9 0-112-50.1-112-112s50.1-112 112-112 112 50.1 112 112-50.1 112-112 112z"/></svg>
              <svg class="login-icon" data-icon="hide" viewBox="64 64 896 896" aria-hidden="true" focusable="false" hidden><path d="M942.2 486.2Q889.47 375.11 816.7 305l-50.88 50.88C807.31 395.53 843.45 447.4 874.7 512 791.5 684.2 673.4 766 512 766q-72.67 0-133.87-22.38L323 798.75Q408 838 512 838q288.3 0 430.2-300.3a60.29 60.29 0 000-51.5zm-63.57-320.64L836 122.88a8 8 0 00-11.32 0L715.31 232.2Q624.86 186 512 186q-288.3 0-430.2 300.3a60.3 60.3 0 000 51.5q56.69 119.4 136.5 191.41L112.48 835a8 8 0 000 11.31L155.17 889a8 8 0 0011.31 0l712.15-712.12a8 8 0 000-11.32zM149.3 512C232.6 339.8 350.7 258 512 258c54.54 0 104.13 9.36 149.12 28.39l-70.3 70.3a176 176 0 00-238.13 238.13l-83.42 83.42C223.1 637.49 183.3 582.28 149.3 512zm246.7 0a112.11 112.11 0 01146.2-106.69L401.31 546.2A112 112 0 01396 512z"/><path d="M508 624c-3.46 0-6.87-.16-10.25-.47l-52.82 52.82a176.09 176.09 0 00227.42-227.42l-52.82 52.82c.31 3.38.47 6.79.47 10.25a111.94 111.94 0 01-112 112z"/></svg>
            </button>
          </div>
          <p class="login-caps" id="login-caps" aria-live="polite"></p>
        </div>
        <button class="login-submit" type="submit" data-login-submit>
          <svg class="login-icon login-spinner" viewBox="0 0 1024 1024" aria-hidden="true" focusable="false" hidden><path d="M988 548c-19.9 0-36-16.1-36-36 0-59.4-11.6-117-34.6-171.3a440.45 440.45 0 00-94.3-139.9 437.71 437.71 0 00-139.9-94.3C629 83.6 571.4 72 512 72c-19.9 0-36-16.1-36-36s16.1-36 36-36c69.1 0 136.2 13.5 199.3 40.3C772.3 66 827 103 874 150c47 47 83.9 101.8 109.7 162.7 26.7 63.1 40.2 130.2 40.2 199.3.1 19.9-16 36-35.9 36z"/></svg>
          <span data-login-submit-label>登录</span>
        </button>
      </form>
      <p class="login-note"><svg class="login-icon" viewBox="64 64 896 896" aria-hidden="true" focusable="false"><path d="M866.9 169.9L527.1 54.1C523 52.7 517.5 52 512 52s-11 .7-15.1 2.1L157.1 169.9c-8.3 2.8-15.1 12.4-15.1 21.2v482.4c0 8.8 5.7 20.4 12.6 25.9L499.3 968c3.5 2.7 8 4.1 12.6 4.1s9.2-1.4 12.6-4.1l344.7-268.6c6.9-5.4 12.6-17 12.6-25.9V191.1c.2-8.8-6.6-18.3-14.9-21.2zM810 654.3L512 886.5 214 654.3V226.7l298-101.6 298 101.6v427.6zm-405.8-201c-3-4.1-7.8-6.6-13-6.6H336c-6.5 0-10.3 7.4-6.5 12.7l126.4 174a16.1 16.1 0 0026 0l212.6-292.7c3.8-5.3 0-12.7-6.5-12.7h-55.2c-5.1 0-10 2.5-13 6.6L468.9 542.4l-64.7-89.1z"/></svg><span>HTTPS 加密传输，登录后会话 12 小时内有效</span></p>
    </div>
  </main>
</div>
<script>
// 渐进增强：脚本不可用时表单仍按原生方式提交；脚本只改展示，不读取或保存密码值。
(function () {
  var form = document.querySelector('[data-login-form]')
  var password = document.getElementById('login-password')
  var reveal = document.querySelector('[data-login-reveal]')
  var caps = document.getElementById('login-caps')
  var submit = document.querySelector('[data-login-submit]')
  if (!form || !password || !reveal || !caps || !submit) return
  reveal.hidden = false
  reveal.addEventListener('click', function () {
    var visible = password.type === 'password'
    password.type = visible ? 'text' : 'password'
    reveal.setAttribute('aria-pressed', String(visible))
    reveal.setAttribute('aria-label', visible ? '隐藏密码' : '显示密码')
    reveal.querySelector('[data-icon="show"]').hidden = visible
    reveal.querySelector('[data-icon="hide"]').hidden = !visible
    password.focus()
  })
  function updateCaps(event) {
    if (!event.getModifierState) return
    caps.textContent = event.getModifierState('CapsLock') ? '大写锁定已开启' : ''
  }
  password.addEventListener('keydown', updateCaps)
  password.addEventListener('keyup', updateCaps)
  password.addEventListener('blur', function () { caps.textContent = '' })
  password.addEventListener('input', function () {
    password.classList.remove('login-input-error')
    password.removeAttribute('aria-invalid')
  })
  form.addEventListener('submit', function (event) {
    // 防重复提交：首次提交后锁定按钮，整页导航完成前不再发送第二次请求。
    if (submit.getAttribute('aria-busy') === 'true') { event.preventDefault(); return }
    password.type = 'password'
    submit.setAttribute('aria-busy', 'true')
    submit.querySelector('.login-spinner').hidden = false
    submit.querySelector('[data-login-submit-label]').textContent = '正在登录'
  })
  // 浏览器后退恢复页面时解除提交锁定。
  window.addEventListener('pageshow', function () {
    submit.removeAttribute('aria-busy')
    submit.querySelector('.login-spinner').hidden = true
    submit.querySelector('[data-login-submit-label]').textContent = '登录'
  })
})()
</script>
</body>
</html>
